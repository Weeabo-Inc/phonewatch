[package]
name = "phonewatch"
version = "0.1.0"
edition = "2021"
description = "Live Windows device-state monitor: USB/phone presence -> JSON snapshot + JSONL history"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 2
